<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="OSCE Playground: studio boneka 3D yang dapat dikendalikan lewat tablet dan ChatGPT MCP.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>OSCE Playground</title>
</head>
<body>
<svg aria-hidden="true" class="svg-defs" xmlns="http://www.w3.org/2000/svg">
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2Z"/><path d="m19 18 .8 2.2L22 21l-2.2.8L19 24l-.8-2.2L16 21l2.2-.8L19 18Z"/></symbol>
 <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1ZM12 6v14"/></symbol>
 <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
 <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5m5 5H10a6 6 0 0 0 0 12h3"/></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
 <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
 <symbol id="i-focus" viewBox="0 0 24 24"><path d="M3 9V4h5M16 4h5v5M21 15v5h-5M8 20H3v-5"/><circle cx="12" cy="12" r="3"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
 <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 19a5 5 0 1 1 1-9 6 6 0 0 1 11 2 4 4 0 0 1-1 7H7Z"/></symbol>
 <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Zm-9 5v10l9 5 9-5V7M12 12v10"/></symbol>
 <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5a2 2 0 0 1 4 0v6-8a2 2 0 0 1 4 0v8-5a2 2 0 0 1 4 0v10c0 4-3 6-7 6h-1c-3 0-5-2-7-5l-2-3a2 2 0 0 1 3-2l2 1Z"/></symbol>
 <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8V4l-4 4 4 4V8a8 8 0 1 0 2 6"/></symbol>
 <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
 <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></symbol>
 <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
 <symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3ZM12 9v5m0 3v1"/></symbol>
 <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20m-13-7 3-3 3 3m-6 14 3 3 3-3M5 9l-3 3 3 3m14-6 3 3-3 3"/></symbol>
</svg>
<div id="app" class="app-shell">
 <header class="topbar">
  <div class="brand"><div class="brand-symbol" aria-hidden="true">✳</div><div class="brand-name"><span class="brand-main">OSCE <em>Playground</em></span><small id="sceneTitle">My Studio</small></div></div>
  <div class="top-actions">
   <button class="status-pill" id="syncButton" type="button" title="Status sinkronisasi dan koneksi"><span class="status-led" id="statusLed"></span><span id="syncStatus">Memuat...</span></button>
   <button class="icon-button" id="undoBtn" type="button" aria-label="Urungkan perubahan" title="Undo"><svg><use href="#i-undo"/></svg></button>
   <button class="icon-button" id="saveBtn" type="button" aria-label="Simpan" title="Simpan"><svg><use href="#i-cloud"/></svg></button>
   <button class="icon-button" id="moreBtn" type="button" aria-label="Menu lainnya" title="Menu lainnya"><svg><use href="#i-more"/></svg></button>
  </div>
 </header>
 <main class="main-area" id="mainArea">
  <section class="viewport-shell" id="stage" aria-label="Studio 3D interaktif">
   <canvas id="scene3d" aria-label="Ruang 3D. Sentuh objek untuk memilih, seret ruang kosong untuk memutar kamera, cubit dua jari untuk zoom." tabindex="0"></canvas>
   <div class="hotspots" id="hotspots" aria-hidden="true"></div>
   <div class="viewport-top">
    <div class="camera-pill">Free Camera <span class="camera-icon" aria-hidden="true">◌</span></div>
    <button class="camera-control" id="resetCamera" type="button" title="Reset kamera" aria-label="Reset kamera"><svg><use href="#i-focus"/></svg></button>
   </div>
   <div class="renderer-pill" id="rendererPill" hidden></div>
   <div class="interaction-hint" id="interactionHint">Tap objek • geser kamera • pinch untuk zoom</div>
   <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><strong>Menyiapkan playground…</strong><small id="loadingDetail">Memuat scene</small><button type="button" class="soft-button" id="retryLoad" hidden>Coba lagi</button></div>
   <div class="error-bar" id="errorBar" role="alert" hidden><svg><use href="#i-alert"/></svg><div class="error-copy"><strong id="errorTitle">Ada masalah</strong><span id="errorText"></span></div><button type="button" id="errorDismiss" aria-label="Tutup error"><svg><use href="#i-close"/></svg></button></div>
   <section class="sheet" id="sheet" aria-label="Panel" hidden>
    <div class="sheet-heading"><div><span class="sheet-eyebrow" id="sheetEyebrow">STUDIO</span><h2 id="sheetTitle">Tambah objek</h2></div><button class="icon-button" id="sheetClose" type="button" aria-label="Tutup panel"><svg><use href="#i-close"/></svg></button></div>
    <div class="sheet-body" id="sheetBody"></div>
   </section>
   <section class="selection-card" id="selectionCard" hidden aria-label="Kontrol objek terpilih">
    <div class="selection-head"><div><span class="selection-kicker" id="selectionKicker">SELECTED</span><strong id="selectionName">Patient</strong></div><div class="selection-head-actions"><button class="mini-icon" id="focusBtn" type="button" title="Fokus pada objek" aria-label="Fokus pada objek"><svg><use href="#i-focus"/></svg></button><button class="mini-icon" id="selectionClose" type="button" title="Batal pilih" aria-label="Batal pilih"><svg><use href="#i-close"/></svg></button></div></div>
    <div id="selectionBody" class="selection-body"></div>
   </section>
   <nav class="dock" aria-label="Aksi utama">
    <button class="dock-item" type="button" data-panel="add"><span class="dock-icon"><svg><use href="#i-plus"/></svg></span><span>Add</span></button>
    <button class="dock-item" type="button" data-panel="ask"><span class="dock-icon special"><svg><use href="#i-spark"/></svg></span><span>Ask GPT</span></button>
    <button class="dock-item" type="button" data-panel="practice"><span class="dock-icon"><svg><use href="#i-book"/></svg></span><span>Practice</span></button>
   </nav>
   <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </section>
 </main>
 <footer class="footnote"><span>Playground 3D · Tablet-first</span><span>Visual latihan, bukan pengukuran medis</span></footer>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script type="module" src="/app.js"></script>
</body>
</html>
