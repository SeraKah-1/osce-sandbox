# Render Blueprint — single-instance app, ephemeral touch sessions + durable MCP worlds.
services:
  - type: web
    name: osce-playground
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: osce-environments
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4173
      - key: ENVIRONMENT_DATA_DIR
        value: /app/data/environments
      - key: API_TOKEN
        generateValue: true
