# Public HTTPS deployment requires your own DNS and strong API_TOKEN.
services:
  studio:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      API_TOKEN: ${API_TOKEN:?Provide a strong API_TOKEN}
      ENVIRONMENT_DATA_DIR: /app/data/environments
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - environment-data:/app/data
    networks: [internal]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      studio:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set your DNS domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
networks:
  internal:
volumes:
  caddy-data:
  caddy-config:
  environment-data:
