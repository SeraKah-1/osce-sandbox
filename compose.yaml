services:
  studio:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      API_TOKEN: ${API_TOKEN:?Set a long random API_TOKEN}
      ENVIRONMENT_DATA_DIR: /app/data/environments
    volumes:
      - environment-data:/app/data
    restart: unless-stopped

volumes:
  environment-data:
