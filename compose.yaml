services:
  studio:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      API_TOKEN: ${API_TOKEN:?Set a long random API_TOKEN in your environment}
      STUDIO_DATA: /app/data/studio.json
    volumes:
      - osce-data:/app/data
    restart: unless-stopped
volumes:
  osce-data:
